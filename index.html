<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beats | Premium Music</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="background-circles">
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="player-container">
        <div class="player-content">
            <div class="player-header">
                <h1 class="player-title">Beats</h1>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" class="search-bar" placeholder="Search your library..."
                        onkeyup="searchSongs(this.value)">
                </div>
            </div>

            <div class="main-display">
                <div class="album-art" id="albumArt">
                    <div class="music-icon">🎵</div>
                </div>
                <div class="song-info">
                    <h2 class="song-name" id="songName">Select a song</h2>
                    <p class="artist-name" id="artistName">Upload your music</p>
                </div>
            </div>

            <div class="player-controls">
                <div class="progress-area">
                    <span id="currentTime">0:00</span>
                    <div class="progress-bar" onclick="seekTo(event)">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span id="totalTime">0:00</span>
                </div>

                <div class="button-group">
                    <button class="control-btn" onclick="skipPrevious()"><i class="fas fa-step-backward"></i></button>
                    <button class="play-btn" id="playBtn" onclick="togglePlayPause()"><i
                            class="fas fa-play"></i></button>
                    <button class="control-btn" onclick="skipNext()"><i class="fas fa-step-forward"></i></button>
                </div>

                <div class="volume-box">
                    <i class="fas fa-volume-up"></i>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70"
                        oninput="changeVolume(this.value)">
                </div>
            </div>
        </div>

        <div class="playlist-section">
            <div class="playlist-header">
                <h3>Library</h3>
                <button class="add-song-btn" onclick="addSongToPlaylist()"><i class="fas fa-plus"></i> Add</button>
            </div>
            <input type="file" id="fileInput" class="file-input" multiple accept="audio/*" onchange="handleFileSelect(event)">
            <div class="playlist-items" id="playlistItems"> </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
